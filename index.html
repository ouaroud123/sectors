<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Sectors & Places Selector</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-md p-6 md:p-8">
        <h1 class="text-2xl font-bold mb-2 text-gray-900">Location Explorer</h1>
        <p class="text-sm text-gray-500 mb-6">Select a country, city, and neighborhood to filter and view available places.</p>

        <!-- Dropdowns Grid -->
        <div class="space-y-4 mb-6">
            <!-- 1. Country -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">1. Country</label>
                <select id="countrySelect" class="w-full border border-gray-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="">Select Country</option>
                </select>
            </div>

            <!-- 2. City -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">2. City</label>
                <select id="citySelect" class="w-full border border-gray-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-indigo-500 outline-none" disabled>
                    <option value="">Select City</option>
                </select>
            </div>

            <!-- 3. Neighborhood / Sector -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">3. Neighborhood / Sector</label>
                <select id="neighborhoodSelect" class="w-full border border-gray-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-indigo-500 outline-none" disabled>
                    <option value="">Select Neighborhood</option>
                </select>
            </div>

            <!-- 4. Place Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">4. Place Name</label>
                <select id="placeSelect" class="w-full border border-gray-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-indigo-500 outline-none" disabled>
                    <option value="">Select Place</option>
                </select>
            </div>
        </div>

        <!-- Selected Place Details Box -->
        <div id="placeDetails" class="hidden bg-indigo-50 border border-indigo-100 rounded-lg p-4 mt-6">
            <h3 class="font-bold text-lg text-indigo-900" id="detName"></h3>
            <p class="text-sm text-indigo-700 font-medium mb-2" id="detCategory"></p>
            <p class="text-xs text-gray-600" id="detLocation"></p>
        </div>
    </div>

    <script>
        // Sample dataset (Easily add or edit your places here)
        const placesData = [
            {
                country: "Morocco",
                city: "Tangier",
                neighborhood: "Plaza Toro",
                placeName: "Cabinet de Traduction Assermentée",
                category: "Sworn Translation (Spanish & Arabic)"
            },
            {
                country: "Morocco",
                city: "Tangier",
                neighborhood: "Malabata",
                placeName: "Grand Cafe de Paris",
                category: "Cafe & Landmark"
            },
            {
                country: "Morocco",
                city: "Casablanca",
                neighborhood: "Maarif",
                placeName: "Twin Center",
                category: "Shopping & Business"
            },
            {
                country: "Spain",
                city: "Madrid",
                neighborhood: "Sol",
                placeName: "Puerta del Sol",
                category: "Public Square"
            }
        ];

        // DOM Elements
        const countrySelect = document.getElementById('countrySelect');
        const citySelect = document.getElementById('citySelect');
        const neighborhoodSelect = document.getElementById('neighborhoodSelect');
        const placeSelect = document.getElementById('placeSelect');
        const placeDetails = document.getElementById('placeDetails');
        
        const detName = document.getElementById('detName');
        const detCategory = document.getElementById('detCategory');
        const detLocation = document.getElementById('detLocation');

        // Initialize Country Dropdown
        function initDropdowns() {
            const countries = [...new Set(placesData.map(item => item.country))];
            countrySelect.innerHTML = '<option value="">Select Country</option>' + 
                countries.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        // 1. Country Change
        countrySelect.addEventListener('change', function() {
            const country = this.value;
            
            // Reset downstream dropdowns
            citySelect.innerHTML = '<option value="">Select City</option>';
            neighborhoodSelect.innerHTML = '<option value="">Select Neighborhood</option>';
            placeSelect.innerHTML = '<option value="">Select Place</option>';
            
            citySelect.disabled = !country;
            neighborhoodSelect.disabled = true;
            placeSelect.disabled = true;
            hideDetails();

            if (country) {
                const cities = [...new Set(placesData.filter(item => item.country === country).map(item => item.city))];
                citySelect.innerHTML += cities.map(c => `<option value="${c}">${c}</option>`).join('');
            }
        });

        // 2. City Change
        citySelect.addEventListener('change', function() {
            const country = countrySelect.value;
            const city = this.value;

            neighborhoodSelect.innerHTML = '<option value="">Select Neighborhood</option>';
            placeSelect.innerHTML = '<option value="">Select Place</option>';
            
            neighborhoodSelect.disabled = !city;
            placeSelect.disabled = true;
            hideDetails();

            if (city) {
                const neighborhoods = [...new Set(placesData.filter(item => item.country === country && item.city === city).map(item => item.neighborhood))];
                neighborhoodSelect.innerHTML += neighborhoods.map(n => `<option value="${n}">${n}</option>`).join('');
            }
        });

        // 3. Neighborhood Change
        neighborhoodSelect.addEventListener('change', function() {
            const country = countrySelect.value;
            const city = citySelect.value;
            const neighborhood = this.value;

            placeSelect.innerHTML = '<option value="">Select Place</option>';
            placeSelect.disabled = !neighborhood;
            hideDetails();

            if (neighborhood) {
                const places = placesData.filter(item => item.country === country && item.city === city && item.neighborhood === neighborhood);
                placeSelect.innerHTML += places.map(p => `<option value="${p.placeName}">${p.placeName}</option>`).join('');
            }
        });

        // 4. Place Change (Final Selection)
        placeSelect.addEventListener('change', function() {
            const placeName = this.value;
            if (!placeName) {
                hideDetails();
                return;
            }

            const selected = placesData.find(item => item.placeName === placeName);
            if (selected) {
                detName.textContent = selected.placeName;
                detCategory.textContent = selected.category;
                detLocation.textContent = `${selected.neighborhood}, ${selected.city}, ${selected.country}`;
                placeDetails.classList.remove('hidden');
            }
        });

        function hideDetails() {
            placeDetails.classList.add('hidden');
        }

        // Run initialization on page load
        initDropdowns();
    </script>
</body>
</html>
